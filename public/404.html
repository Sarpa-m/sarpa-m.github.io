<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>sarpa.dev</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #060912;
        color: #8b95a8;
        font-family: 'Space Mono', monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        flex-direction: column;
        gap: 1rem;
        text-align: center;
        padding: 2rem;
      }
      .code { font-size: clamp(3rem, 15vw, 6rem); font-weight: 700; color: #818cf8; line-height: 1; }
      .msg  { font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: #4b5563; }
      .back { margin-top: 0.5rem; color: #818cf8; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.1em; }
      .back:hover { color: #fff; }
    </style>
    <script>
      // Redireciona para a SPA preservando o path (spa-github-pages pattern)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div class="code">404</div>
    <div class="msg">Página não encontrada</div>
    <a class="back" href="/">← voltar para sarpa.dev</a>
  </body>
</html>
